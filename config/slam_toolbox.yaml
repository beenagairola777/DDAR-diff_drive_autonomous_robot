slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    debug_logging: false
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    do_loop_closing: true
